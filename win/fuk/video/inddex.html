
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Video Page</title>
  <meta name="description" content="Video page with thumbnail and related content.">
  <style>
    body {
      margin: 0;
      padding: 24px;
      font-family: Arial, sans-serif;
      background: #111;
      color: #fff;
    }
    main {
      max-width: 850px;
      margin: auto;
    }
    .player {
      background: #252525;
      aspect-ratio: 16 / 9;
      display: grid;
      place-items: center;
      border-radius: 10px;
    }
    h1 { font-size: 26px; }
  </style>
</head>
<body>
  <main>
    <h1>Video Page</h1>
    <div class="player">
      <p>Your video or thumbnail goes here.</p>
    </div>
    <h2>Watch Next</h2>
    <p>Explore more videos.</p>
  </main>
</body>
</html>
